name: Build SM64 Bob-omb Battlefield APK

# Build recipe follows the README of VDavid003/sm64-port-android-base:
#   1) baserom.us.z64 into app/jni/src   2) fetch SDL2 sources
#   3) native `make` in app/jni/src (extracts assets, generates C sources)
#   4) ./gradlew assembleDebug (ndk-build through app/jni/Android.mk)
# Written without being able to run it. If a step fails, read that step's log.
# Game changes (level select screen, touch UI, 30 Hz pacing) are applied by the
# 'Apply level-select...' step, after the host asset build.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # Upstream sources, pinned to the exact commits that were inspected.
  BASE_REPO: https://github.com/VDavid003/sm64-port-android-base.git
  BASE_SHA: a71e0c11b7645ec401fcfc376295134f4e5e81b7
  GAME_REPO: https://github.com/VDavid003/sm64-port-android.git
  GAME_SHA: b43af4667bd1cde0d6cb11004add92ffaffab1c5
  # US ROM, big-endian .z64 (from sm64.us.sha1 in the source)
  ROM_SHA1: 9bef1128717f958171a4afac3ed78ee2bb4e86ce
  # SDL2 2.0.12 zip hash (from the Dockerfile of the base repo)
  SDL_SHA256: 476e84d6fcbc499cd1f4a2d3fd05a924abc165b5d0e0d53522c9604fe5a021aa
  NDK_VERSION: 21.4.7075529
  ABI: armeabi-v7a

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout this private repo (workflow + your ROM)
        uses: actions/checkout@v4

      - name: Check ROM is present and is the US .z64
        run: |
          if [ ! -f baserom.us.z64 ]; then
            echo "::error::baserom.us.z64 not found in the repo root. Upload your own legally obtained US ROM with exactly that name."
            exit 1
          fi
          echo "$ROM_SHA1  baserom.us.z64" | sha1sum -c - || {
            echo "::error::ROM SHA-1 mismatch. Need the US (NTSC-U) ROM in big-endian .z64 format. Got: $(sha1sum baserom.us.z64)"
            exit 1
          }

      - name: Fetch pinned upstream sources
        run: |
          git clone "$BASE_REPO" android-base
          git -C android-base checkout "$BASE_SHA"
          rm -rf android-base/app/jni/src
          git clone "$GAME_REPO" android-base/app/jni/src
          git -C android-base/app/jni/src checkout "$GAME_SHA"
          git -C android-base rev-parse HEAD
          git -C android-base/app/jni/src rev-parse HEAD

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config binutils bsdmainutils \
            libsdl2-dev libgl1-mesa-dev libglew-dev libx11-dev libxrandr-dev \
            libusb-1.0-0-dev libasound2-dev libpulse-dev libaudiofile-dev libzstd-dev \
            wget unzip

      - name: Put ROM where the build expects it
        run: cp baserom.us.z64 android-base/app/jni/src/baserom.us.z64

      - name: Fetch SDL2 2.0.12 sources (same steps as getSDL.sh, plus hash check)
        working-directory: android-base/app/jni/SDL
        run: |
          wget -q https://www.libsdl.org/release/SDL2-2.0.12.zip
          echo "$SDL_SHA256  SDL2-2.0.12.zip" | sha256sum -c -
          unzip -q SDL2-2.0.12.zip
          mv SDL2-2.0.12/src src
          mv SDL2-2.0.12/include include
          ln -s . include/SDL2
          rm -rf SDL2-2.0.12.zip SDL2-2.0.12

      - name: Native make (extracts assets from your ROM, generates sources)
        working-directory: android-base/app/jni/src
        run: |
          set +e
          make -j"$(nproc)" 2>&1 | tee ../../../../native-make.log
          status=${PIPESTATUS[0]}
          set -e
          echo "native make exit status: $status"
          # The Android build only needs the generated files. Verify them
          # explicitly instead of trusting the host link step.
          missing=0
          for f in build/us_pc/assets/mario_anim_data.c \
                   build/us_pc/assets/demo_data.c \
                   build/us_pc/include/level_headers.h \
                   build/us_pc/sound/sound_data.ctl.le.32.inc.c \
                   build/us_pc/sound/sound_data.tbl.le.32.inc.c \
                   build/us_pc/sound/sequences.bin.le.32.inc.c \
                   build/us_pc/sound/bank_sets.le.32.inc.c \
                   levels/bob/0.rgba16.png; do
            if [ ! -f "$f" ]; then echo "::error::missing generated file: $f"; missing=1; fi
          done
          # Texture data is generated INTO the build dir (Makefile rule
          # $(BUILD_DIR)/%.inc.c), not into levels/. Android.mk puts
          # build/us_pc on the include path, so every texture include used by
          # Bob-omb Battlefield must resolve there.
          for inc in $(grep -o '#include "[^"]*\.inc\.c"' levels/bob/texture.inc.c | sed 's/#include "//; s/"$//'); do
            if [ ! -f "build/us_pc/$inc" ]; then echo "::error::missing generated texture: build/us_pc/$inc"; missing=1; fi
          done
          ls build/us_pc/bin/*_skybox.c >/dev/null 2>&1 || { echo "::error::no generated skybox sources"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::host make exited with $status but all generated files exist; continuing to the Android build."
          fi

      - name: Apply level-select, touch-UI and frame-pacing patch
        working-directory: android-base/app/jni/src
        run: |
          # Applied AFTER the native (host) make on purpose: the host build only
          # generates assets and must see the unpatched sources.
          cat > "$RUNNER_TEMP/touch_level_select.c" <<'CEOF'
          // Touch level select screen and shared translucent touch-UI drawing helpers.
          // Added for the Android build. Drawn with the game's own display lists, so
          // it renders through the same Fast3D/OpenGL ES path as the rest of the HUD.
          #ifdef TOUCH_CONTROLS
          #include <PR/ultratypes.h>
          #include <PR/gbi.h>

          #include "config.h"
          #include "sm64.h"
          #include "types.h"
          #include "audio/external.h"
          #include "game/area.h"
          #include "game/game_init.h"
          #include "game/memory.h"
          #include "game/segment2.h"
          #include "level_table.h"

          #include "controller_touchscreen.h"

          // ---------------------------------------------------------------------------
          // Drawing helpers. All coordinates are "API units": 1280 x 960 for the 4:3
          // area, i.e. 4 units per virtual pixel (same space the touch controls use).
          // ---------------------------------------------------------------------------

          ALIGNED8 static u8 sSolidTexture[16 * 16 * 2];
          static int sSolidTextureReady = 0;

          static void set_texture(const u8 *img) {
              gDPPipeSync(gDisplayListHead++);
              gDPSetTextureImage(gDisplayListHead++, G_IM_FMT_RGBA, G_IM_SIZ_16b, 1, img);
              gSPDisplayList(gDisplayListHead++, dl_hud_img_load_tex_block);
          }

          void touch_ui_begin(void) {
              Mtx *mtx;

              if (!sSolidTextureReady) {
                  int i;
                  for (i = 0; i < (int) sizeof(sSolidTexture); i++) {
                      sSolidTexture[i] = 0xFF; // RGBA5551 white, opaque
                  }
                  sSolidTextureReady = 1;
              }

              mtx = alloc_display_list(sizeof(*mtx));
              if (mtx == NULL) {
                  return;
              }

              guOrtho(mtx, 0.0f, SCREEN_WIDTH, 0.0f, SCREEN_HEIGHT, -10.0f, 10.0f, 1.0f);
              gSPPerspNormalize((Gfx *) (gDisplayListHead++), 0xFFFF);
              gSPMatrix(gDisplayListHead++, VIRTUAL_TO_PHYSICAL(mtx), G_MTX_PROJECTION | G_MTX_LOAD | G_MTX_NOPUSH);

              // 1-cycle, translucent: colour = texel * env colour, alpha = texel alpha * env alpha
              gDPPipeSync(gDisplayListHead++);
              gDPSetCycleType(gDisplayListHead++, G_CYC_1CYCLE);
              gDPSetTexturePersp(gDisplayListHead++, G_TP_NONE);
              gDPSetAlphaCompare(gDisplayListHead++, G_AC_NONE);
              gDPSetTextureFilter(gDisplayListHead++, G_TF_POINT);
              gDPSetCombineMode(gDisplayListHead++, G_CC_FADEA, G_CC_FADEA);
              gDPSetRenderMode(gDisplayListHead++, G_RM_AA_XLU_SURF, G_RM_AA_XLU_SURF2);
          }

          void touch_ui_end(void) {
              gSPDisplayList(gDisplayListHead++, dl_hud_img_end);
          }

          // Draw a 16x16 texture stretched over the rectangle.
          void touch_ui_quad(const u8 *tex, s32 x0, s32 y0, s32 x1, s32 y1, u8 r, u8 g, u8 b, u8 a) {
              s32 w = x1 - x0;
              s32 h = y1 - y0;
              s16 dsdx;
              s16 dtdy;

              if (w <= 0 || h <= 0) {
                  return;
              }
              // S5.10 texels per pixel: 16 texels over (w / 4) pixels
              dsdx = (s16) (65536 / w);
              dtdy = (s16) (65536 / h);

              set_texture(tex);
              gDPSetEnvColor(gDisplayListHead++, r, g, b, a);
              gSPTextureRectangle(gDisplayListHead++, x0, y0, x1, y1, G_TX_RENDERTILE, 0, 0, dsdx, dtdy);
          }

          void touch_ui_card(s32 x0, s32 y0, s32 x1, s32 y1, u8 r, u8 g, u8 b, u8 a) {
              touch_ui_quad(sSolidTexture, x0, y0, x1, y1, r, g, b, a);
          }

          s32 touch_ui_text_width(s32 size, const char *s) {
              s32 n = 0;
              while (s[n] != '\0') {
                  n++;
              }
              return n * (size * 3 / 4);
          }

          // Letters, digits and spaces only (HUD font glyph table).
          void touch_ui_text(s32 x, s32 y, s32 size, const char *s, u8 r, u8 g, u8 b, u8 a) {
              const u8 *const *glyphs = segmented_to_virtual(main_hud_lut);
              s32 advance = size * 3 / 4;
              s32 i;

              for (i = 0; s[i] != '\0'; i++) {
                  char c = s[i];
                  int glyph = -1;

                  if (c >= 'A' && c <= 'Z') {
                      glyph = c - 55;
                  } else if (c >= 'a' && c <= 'z') {
                      glyph = c - 87;
                  } else if (c >= '0' && c <= '9') {
                      glyph = c - 48;
                  }
                  if (glyph >= 0) {
                      touch_ui_quad(glyphs[glyph], x + i * advance, y, x + i * advance + size, y + size, r, g, b, a);
                  }
              }
          }

          // ---------------------------------------------------------------------------
          // Level select screen
          // ---------------------------------------------------------------------------

          struct LevelCard {
              const char *name;
              s16 level;
          };

          // Only courses whose data is compiled into this build. The workflow checks
          // that every level listed here has its generated assets before the APK is built.
          static const struct LevelCard sLevels[] = {
              { "BOBOMB BATTLEFIELD", LEVEL_BOB },
              { "WHOMPS FORTRESS", LEVEL_WF },
              { "JOLLY ROGER BAY", LEVEL_JRB },
              { "COOL COOL MOUNTAIN", LEVEL_CCM },
              { "BIG BOOS HAUNT", LEVEL_BBH },
              { "HAZY MAZE CAVE", LEVEL_HMC },
              { "LETHAL LAVA LAND", LEVEL_LLL },
              { "SHIFTING SAND LAND", LEVEL_SSL },
              { "DIRE DIRE DOCKS", LEVEL_DDD },
              { "SNOWMANS LAND", LEVEL_SL },
              { "WET DRY WORLD", LEVEL_WDW },
              { "TALL TALL MOUNTAIN", LEVEL_TTM },
              { "TINY HUGE ISLAND", LEVEL_THI },
              { "TICK TOCK CLOCK", LEVEL_TTC },
              { "RAINBOW RIDE", LEVEL_RR },
          };
          #define LEVEL_COUNT ((int) (sizeof(sLevels) / sizeof(sLevels[0])))

          #define ROWS_PER_PAGE 5
          #define LIST_X0 120
          #define LIST_X1 820
          #define ROW_Y0 200
          #define ROW_H 110
          #define ROW_STEP 126
          #define PAGE_Y0 850
          #define PAGE_Y1 930
          #define COL_X0 860
          #define COL_X1 1160
          #define CHIP_SIZE 90
          #define CHIP_STEP 105
          #define CHIP_Y0 290
          #define PLAY_Y0 600
          #define PLAY_Y1 760

          static int sSelected = 0;
          static int sPage = 0;
          static int sMission = 1;

          static int hit(int x, int y, int x0, int y0, int x1, int y1) {
              return x >= x0 && x < x1 && y >= y0 && y < y1;
          }

          static int start_selected_level(void) {
              gLevelSelectUiActive = 0;
              gCurrSaveFileNum = 1;
              gCurrLevelNum = sLevels[sSelected].level;
              gCurrActNum = sMission;
              play_sound(SOUND_MENU_STAR_SOUND, gDefaultSoundArgs);
              return gCurrLevelNum;
          }

          // Called once per frame by the level script (replaces the original debug
          // level select input loop). Returns the level number once Play is tapped.
          s16 touch_level_select_update(void) {
              int tx;
              int ty;
              int i;

              gLevelSelectUiActive = 1;
              gLevelSelectBackRequested = 0;
              gCurrSaveFileNum = 1;
              gCurrActNum = sMission;

              // Physical gamepad / keyboard Start also starts the highlighted level.
              if (gPlayer1Controller->buttonPressed & START_BUTTON) {
                  return start_selected_level();
              }

              if (!touch_ui_poll_tap(&tx, &ty)) {
                  return 0;
              }

              for (i = 0; i < ROWS_PER_PAGE; i++) {
                  int idx = sPage * ROWS_PER_PAGE + i;
                  int y0 = ROW_Y0 + i * ROW_STEP;
                  if (idx < LEVEL_COUNT && hit(tx, ty, LIST_X0, y0, LIST_X1, y0 + ROW_H)) {
                      sSelected = idx;
                      play_sound(SOUND_GENERAL_LEVEL_SELECT_CHANGE, gDefaultSoundArgs);
                      return 0;
                  }
              }

              if (hit(tx, ty, LIST_X0, PAGE_Y0, 460, PAGE_Y1) && sPage > 0) {
                  sPage--;
                  play_sound(SOUND_GENERAL_LEVEL_SELECT_CHANGE, gDefaultSoundArgs);
                  return 0;
              }
              if (hit(tx, ty, 480, PAGE_Y0, LIST_X1, PAGE_Y1) && (sPage + 1) * ROWS_PER_PAGE < LEVEL_COUNT) {
                  sPage++;
                  play_sound(SOUND_GENERAL_LEVEL_SELECT_CHANGE, gDefaultSoundArgs);
                  return 0;
              }

              for (i = 0; i < 6; i++) {
                  int cx = COL_X0 + (i % 3) * CHIP_STEP;
                  int cy = CHIP_Y0 + (i / 3) * CHIP_STEP;
                  if (hit(tx, ty, cx, cy, cx + CHIP_SIZE, cy + CHIP_SIZE)) {
                      sMission = i + 1;
                      play_sound(SOUND_GENERAL_LEVEL_SELECT_CHANGE, gDefaultSoundArgs);
                      return 0;
                  }
              }

              if (hit(tx, ty, COL_X0, PLAY_Y0, COL_X1, PLAY_Y1)) {
                  return start_selected_level();
              }

              return 0;
          }

          static void draw_button(int x0, int y0, int x1, int y1, const char *label, int size, int enabled) {
              s32 tw = touch_ui_text_width(size, label);
              u8 a = enabled ? 255 : 90;

              touch_ui_card(x0, y0, x1, y1, 0, 0, 0, 128);
              touch_ui_text((x0 + x1 - tw) / 2, (y0 + y1 - size) / 2, size, label, 255, 255, 255, a);
          }

          void render_level_select_ui(void) {
              char digit[2];
              int i;
              s32 tw;

              touch_ui_begin();

              tw = touch_ui_text_width(64, "SELECT LEVEL");
              touch_ui_text(640 - tw / 2, 90, 64, "SELECT LEVEL", 255, 255, 255, 255);

              for (i = 0; i < ROWS_PER_PAGE; i++) {
                  int idx = sPage * ROWS_PER_PAGE + i;
                  int y0 = ROW_Y0 + i * ROW_STEP;
                  if (idx >= LEVEL_COUNT) {
                      break;
                  }
                  if (idx == sSelected) {
                      touch_ui_card(LIST_X0 - 10, y0 - 10, LIST_X1 + 10, y0 + ROW_H + 10, 255, 255, 255, 220);
                  }
                  touch_ui_card(LIST_X0, y0, LIST_X1, y0 + ROW_H, 0, 0, 0, idx == sSelected ? 190 : 128);
                  touch_ui_text(LIST_X0 + 40, y0 + (ROW_H - 48) / 2, 48, sLevels[idx].name, 255, 255, 255, 255);
              }

              draw_button(LIST_X0, PAGE_Y0, 460, PAGE_Y1, "PREV", 40, sPage > 0);
              draw_button(480, PAGE_Y0, LIST_X1, PAGE_Y1, "NEXT", 40, (sPage + 1) * ROWS_PER_PAGE < LEVEL_COUNT);

              tw = touch_ui_text_width(40, "MISSION");
              touch_ui_text((COL_X0 + COL_X1 - tw) / 2, 215, 40, "MISSION", 255, 255, 255, 255);
              digit[1] = '\0';
              for (i = 0; i < 6; i++) {
                  int cx = COL_X0 + (i % 3) * CHIP_STEP;
                  int cy = CHIP_Y0 + (i / 3) * CHIP_STEP;
                  if (i + 1 == sMission) {
                      touch_ui_card(cx - 8, cy - 8, cx + CHIP_SIZE + 8, cy + CHIP_SIZE + 8, 255, 255, 255, 220);
                  }
                  touch_ui_card(cx, cy, cx + CHIP_SIZE, cy + CHIP_SIZE, 0, 0, 0, i + 1 == sMission ? 190 : 128);
                  digit[0] = (char) ('1' + i);
                  touch_ui_text(cx + (CHIP_SIZE - 36) / 2, cy + (CHIP_SIZE - 48) / 2, 48, digit, 255, 255, 255, 255);
              }

              touch_ui_card(COL_X0 - 8, PLAY_Y0 - 8, COL_X1 + 8, PLAY_Y1 + 8, 255, 255, 255, 220);
              draw_button(COL_X0, PLAY_Y0, COL_X1, PLAY_Y1, "PLAY", 64, 1);

              touch_ui_end();
          }

          #endif // TOUCH_CONTROLS
          CEOF
          cat > "$RUNNER_TEMP/apply_patches.py" <<'PYEOF'
          # Android level-select + touch + frame-pacing patch for sm64-port-android.
          # Run from the game source root (app/jni/src). Every edit asserts its anchor.
          import sys

          def patch(path, old, new, count=1):
              s = open(path).read()
              assert s.count(old) == count, "anchor found %d times (want %d) in %s:\n%s" % (s.count(old), count, path, old)
              open(path, "w").write(s.replace(old, new))

          # --- 1. new source file: level select screen + shared translucent UI helpers
          open("src/pc/controller/touch_level_select.c", "w").write(open(sys.argv[1]).read())

          # --- 2. touch controller header: shared declarations
          patch("src/pc/controller/controller_touchscreen.h",
          "extern struct ControllerAPI controller_touchscreen;\n",
          """extern struct ControllerAPI controller_touchscreen;

          #include <PR/ultratypes.h>
          extern s32 gLevelSelectUiActive;      // 1 while the level select screen is shown
          extern s32 gLevelSelectBackRequested; // set by the in-game Back button
          int touch_ui_poll_tap(int *x, int *y);
          void touch_ui_begin(void);
          void touch_ui_end(void);
          void touch_ui_quad(const u8 *tex, s32 x0, s32 y0, s32 x1, s32 y1, u8 r, u8 g, u8 b, u8 a);
          void touch_ui_card(s32 x0, s32 y0, s32 x1, s32 y1, u8 r, u8 g, u8 b, u8 a);
          void touch_ui_text(s32 x, s32 y, s32 size, const char *s, u8 r, u8 g, u8 b, u8 a);
          s32 touch_ui_text_width(s32 size, const char *s);
          s16 touch_level_select_update(void);
          void render_level_select_ui(void);
          """)

          # --- 3. touch controller: tap polling, Back button hit test
          patch("src/pc/controller/controller_touchscreen.c",
          "#define JOYSTICK_SIZE 280\n",
          """#define JOYSTICK_SIZE 280

          s32 gLevelSelectUiActive = 0;
          static int sTapPending = 0;
          static int sTapX = 0;
          static int sTapY = 0;

          // "BACK" button (API units), bottom left of the Start button.
          #define BACK_X0 380
          #define BACK_Y0 850
          #define BACK_X1 580
          #define BACK_Y1 950

          int touch_ui_poll_tap(int *x, int *y) {
              if (!sTapPending) {
                  return 0;
              }
              *x = sTapX;
              *y = sTapY;
              sTapPending = 0;
              return 1;
          }
          """)

          patch("src/pc/controller/controller_touchscreen.c",
          "void touch_down(struct TouchEvent* event) {\n    struct Position pos;\n",
          """void touch_down(struct TouchEvent* event) {
              struct Position pos;

              sTapX = (int) CORRECT_TOUCH_X(event->x);
              sTapY = (int) CORRECT_TOUCH_Y(event->y);
              sTapPending = 1;
              if (gLevelSelectUiActive) {
                  return; // level select screen handles taps itself
              }
              if (sTapX >= BACK_X0 && sTapX < BACK_X1 && sTapY >= BACK_Y0 && sTapY < BACK_Y1) {
                  gLevelSelectBackRequested = 1;
                  return;
              }
          """)

          # --- 4. touch controller rendering: black, ~50% opacity (128/255)
          s = open("src/pc/controller/controller_touchscreen.c").read()
          a = s.index("void render_touch_controls(void) {")
          b = s.index("static void touchscreen_init() {")
          new_render = r'''#define TOUCH_ALPHA 128         // 50% black
          #define TOUCH_ALPHA_PRESSED 192 // 75% black while held
          #define TOUCH_LABEL_ALPHA 140   // white labels at ~55%

          static void touch_sprite(const u8 *tex, s32 x, s32 y, int scaling, u8 r, u8 g, u8 b, u8 a) {
              touch_ui_quad(tex, x - (15 << scaling), y - (15 << scaling), x + (15 << scaling), y + (15 << scaling), r, g, b, a);
          }

          void render_touch_controls(void) {
              const u8 *const *glyphs;
              struct Position pos;

              if (gLevelSelectUiActive) {
                  render_level_select_ui();
                  sTapPending = 0;
                  return;
              }

              glyphs = segmented_to_virtual(main_hud_lut);
              touch_ui_begin();

              for (int i = 0; i < ControlElementsLength; i++) {
                  switch (ControlElements[i].type) {
                      case Joystick:
                          pos = ControlElements[i].GetPos();
                          touch_sprite(texture_button, pos.x, pos.y, 3, 0, 0, 0, TOUCH_ALPHA);
                          touch_sprite(texture_button, pos.x + 4 + ControlElements[i].joyX, pos.y + 4 + ControlElements[i].joyY, 2, 0, 0, 0, TOUCH_ALPHA);
                          break;
                      case Button:
                          pos = ControlElements[i].GetPos();
                          touch_sprite(texture_button, pos.x - 8, pos.y, 2, 0, 0, 0,
                                       ControlElements[i].touchID ? TOUCH_ALPHA_PRESSED : TOUCH_ALPHA);
                          touch_sprite(glyphs[ControlElements[i].character - 87], pos.x, pos.y, 1, 255, 255, 255, TOUCH_LABEL_ALPHA);
                          break;
                  }
              }

              // In-game Back button: returns to the level select screen.
              touch_ui_card(BACK_X0, BACK_Y0, BACK_X1, BACK_Y1, 0, 0, 0, TOUCH_ALPHA);
              touch_ui_text((BACK_X0 + BACK_X1 - touch_ui_text_width(48, "BACK")) / 2, (BACK_Y0 + BACK_Y1 - 48) / 2, 48,
                            "BACK", 255, 255, 255, TOUCH_LABEL_ALPHA);

              touch_ui_end();
              sTapPending = 0;
          }

          '''
          s = s[:a] + new_render + s[b:]
          open("src/pc/controller/controller_touchscreen.c", "w").write(s)

          # --- 5. replace the debug level select input loop with the touch screen
          patch("src/menu/level_select_menu.c",
          "s16 level_select_input_loop(void) {\n",
          """#ifdef TOUCH_CONTROLS
          extern s16 touch_level_select_update(void);
          s16 level_select_input_loop(void) {
              return touch_level_select_update();
          }
          static UNUSED s16 level_select_input_loop_original(void) {
          #else
          s16 level_select_input_loop(void) {
          #endif
          """)

          # --- 6. boot into the level select screen (original debug select screen script)
          patch("levels/entry.c",
          "/*entry*/ level_intro_entry_1),",
          "/*entry*/ level_intro_entry_4),")

          # --- 7. enable the engine's debug-level-select mode: no act select, finishing a
          # course / dying / pause->Exit Course return to the level select screen.
          patch("src/pc/pc_main.c",
          "    audio_init();\n    sound_init();\n",
          "    gDebugLevelSelect = TRUE; // original engine level-select mode\n    audio_init();\n    sound_init();\n")

          # --- 8. Back button request handled inside the level update, using the same
          # fade + special warp (-9) the original pause-menu 'Exit Course' uses.
          patch("src/game/level_update.c",
          "s32 update_level(void) {\n    s32 changeLevel;\n\n    switch (sCurrPlayMode) {",
          """s32 gLevelSelectBackRequested = 0;

          s32 update_level(void) {
              s32 changeLevel;

              if (gLevelSelectBackRequested) {
                  gLevelSelectBackRequested = FALSE;
                  if (sCurrPlayMode == PLAY_MODE_NORMAL || sCurrPlayMode == PLAY_MODE_PAUSED) {
                      gCameraMovementFlags &= ~CAM_MOVE_PAUSE_SCREEN;
                      fade_into_special_warp(-9, 1);
                  }
              }

              switch (sCurrPlayMode) {""")
          patch("src/game/level_update.c",
          "s32 init_level(void) {\n    s32 val4 = 0;\n\n    set_play_mode(PLAY_MODE_NORMAL);",
          "s32 init_level(void) {\n    s32 val4 = 0;\n\n    gLevelSelectBackRequested = FALSE;\n    set_play_mode(PLAY_MODE_NORMAL);")

          # --- 9. frame pacing (Android): exact 30 Hz fixed timestep on a monotonic
          # high-resolution clock, and refresh-rate-aware repeat count.
          G = "src/pc/gfx/gfx_sdl2.c"
          patch(G, "    Uint32 start;\n    Uint32 end;\n", "    Uint64 start;\n    Uint64 end;\n")
          patch(G,
          """    start = SDL_GetTicks();
              SDL_GL_SwapWindow(wnd);
              SDL_GL_SwapWindow(wnd);
              SDL_GL_SwapWindow(wnd);
              SDL_GL_SwapWindow(wnd);
              end = SDL_GetTicks();

              float average = 4.0 * 1000.0 / (end - start);
          """,
          """    start = SDL_GetPerformanceCounter();
              for (int swap_i = 0; swap_i < 16; swap_i++) {
                  SDL_GL_SwapWindow(wnd);
              }
              end = SDL_GetPerformanceCounter();

              float average = 16.0 * (double) SDL_GetPerformanceFrequency() / (double) (end - start);
          """)
          patch(G,
          """    render_multiplier = (average + 15) / 30;
              if (render_multiplier == 0)
                  render_multiplier = 1;
          """,
          """    // Largest whole number of display refreshes that fits in one 30 Hz game
              // tick; the pacing limiter below supplies the remaining time exactly.
              render_multiplier = (int) (average / 30.0f + 0.05f);
              if (render_multiplier < 1 || average > 150.0f)
                  render_multiplier = 1;
          """)
          patch(G,
          "static void gfx_sdl_swap_buffers_end(void) {\n}\n",
          """#ifdef __ANDROID__
          // Fixed 30 Hz game tick on a monotonic high-resolution clock, called once per
          // game tick. Frames that finish early wait out the rest of the period; frames
          // that finish late are made up for by shorter waits afterwards, so the long-run
          // rate is exactly 30 ticks/s on any refresh rate (60, 72, 90, 120 Hz...).
          static void android_pace_frame(void) {
              static Uint64 deadline = 0;
              const Uint64 freq = SDL_GetPerformanceFrequency();
              const Uint64 period = freq / 30;
              Uint64 now = SDL_GetPerformanceCounter();

              if (deadline == 0 || now > deadline + period * 2) {
                  deadline = now; // first frame, or a long stall (app paused, level load)
              } else if (now < deadline) {
                  Uint64 ms = (deadline - now) * 1000 / freq;
                  if (ms > 1) {
                      SDL_Delay((Uint32) (ms - 1));
                  }
                  while (SDL_GetPerformanceCounter() < deadline) {
                  }
              }
              deadline += period;
          }
          #endif

          static void gfx_sdl_swap_buffers_end(void) {
          #ifdef __ANDROID__
              android_pace_frame();
          #endif
          }
          """)
          print("android level select / touch / pacing patch applied")
          PYEOF
          python3 "$RUNNER_TEMP/apply_patches.py" "$RUNNER_TEMP/touch_level_select.c"
          git status --short | head -20 || true

      - name: Verify every level on the select screen has generated assets
        working-directory: android-base/app/jni/src
        run: |
          levels=$(grep -o ', LEVEL_[A-Z]* }' src/pc/controller/touch_level_select.c | sed 's/, LEVEL_//; s/ }//' | tr 'A-Z' 'a-z')
          test -n "$levels" || { echo "::error::could not read level list"; exit 1; }
          missing=0
          for f in $levels; do
            for need in levels/$f/script.c levels/$f/geo.c levels/$f/leveldata.c \
                        build/us_pc/levels/$f/leveldata.o build/us_pc/levels/$f/script.o; do
              if [ ! -f "$need" ]; then echo "::error::level '$f' missing $need"; missing=1; fi
            done
            if [ -f "levels/$f/texture.inc.c" ]; then
              for inc in $(grep -o '#include "[^"]*\.inc\.c"' "levels/$f/texture.inc.c" | sed 's/#include "//; s/"$//'); do
                if [ ! -f "build/us_pc/$inc" ]; then echo "::error::level '$f' missing generated texture build/us_pc/$inc"; missing=1; fi
              done
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "verified assets for levels: $(echo $levels)"

      - name: Set up JDK 11 (for Gradle 7.1 / AGP 4.2.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # newer cmdline-tools need JDK 17 to run sdkmanager itself
          SDK_JAVA="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | JAVA_HOME="$SDK_JAVA" "$SDKM" --licenses > /dev/null || true
          JAVA_HOME="$SDK_JAVA" "$SDKM" --install "platforms;android-26" "build-tools;30.0.2" "ndk;$NDK_VERSION"

      - name: Restrict native build to one ABI (32-bit ARM, armeabi-v7a)
        working-directory: android-base
        run: |
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters '$ABI'/" app/build.gradle
          sed -i "s/^APP_ABI := .*/APP_ABI := $ABI/" app/jni/Application.mk
          grep -n "abiFilters" app/build.gradle
          grep -n "^APP_ABI" app/jni/Application.mk
          grep -q "^ *abiFilters '$ABI'\$" app/build.gradle || { echo "::error::abiFilters was not rewritten to $ABI"; exit 1; }
          grep -q "^APP_ABI := $ABI\$" app/jni/Application.mk || { echo "::error::APP_ABI was not rewritten to $ABI"; exit 1; }

      - name: Build debug APK
        working-directory: android-base
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists and every native library is 32-bit ARM
        run: |
          APK=android-base/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          ls -l "$APK"
          test "$(stat -c %s "$APK")" -gt 1000000 || { echo "::error::APK suspiciously small"; exit 1; }
          unzip -l "$APK" | grep -E "lib/$ABI/(libmain|libSDL2)\\.so"
          libs=$(unzip -Z1 "$APK" | grep -E '^lib/.*\.so$' || true)
          test -n "$libs" || { echo "::error::no native libraries in APK"; exit 1; }
          if echo "$libs" | grep -qv "^lib/$ABI/"; then
            echo "::error::APK contains native libraries for other ABIs:"; echo "$libs"; exit 1
          fi
          rm -rf apk-libs && mkdir apk-libs
          unzip -q -o "$APK" 'lib/*' -d apk-libs
          fail=0
          for so in $(find apk-libs -name '*.so' | sort); do
            hdr=$(readelf -h "$so")
            cls=$(echo "$hdr" | sed -n 's/^ *Class: *//p')
            mach=$(echo "$hdr" | sed -n 's/^ *Machine: *//p')
            echo "$so -> class=[$cls] machine=[$mach]"
            readelf -A "$so" | grep -E "Tag_CPU_arch:" || true
            if [ "$cls" != "ELF32" ] || [ "$mach" != "ARM" ]; then
              echo "::error::$so is not 32-bit ARM"; fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          mkdir -p dist
          cp "$APK" dist/sm64-bob-debug-armv7.apk
          sha256sum dist/sm64-bob-debug-armv7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64-bob-debug-armv7-apk
          path: dist/sm64-bob-debug-armv7.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: native-make.log
          if-no-files-found: ignore
          retention-days: 7
