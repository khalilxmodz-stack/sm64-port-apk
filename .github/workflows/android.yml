name: Build SM64 Bob-omb Battlefield APK

# Build recipe follows the README of VDavid003/sm64-port-android-base:
#   1) baserom.us.z64 into app/jni/src   2) fetch SDL2 sources
#   3) native `make` in app/jni/src (extracts assets, generates C sources)
#   4) ./gradlew assembleDebug (ndk-build through app/jni/Android.mk)
# Written without being able to run it. If a step fails, read that step's log.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # Upstream sources, pinned to the exact commits that were inspected.
  BASE_REPO: https://github.com/VDavid003/sm64-port-android-base.git
  BASE_SHA: a71e0c11b7645ec401fcfc376295134f4e5e81b7
  GAME_REPO: https://github.com/VDavid003/sm64-port-android.git
  GAME_SHA: b43af4667bd1cde0d6cb11004add92ffaffab1c5
  # US ROM, big-endian .z64 (from sm64.us.sha1 in the source)
  ROM_SHA1: 9bef1128717f958171a4afac3ed78ee2bb4e86ce
  # SDL2 2.0.12 zip hash (from the Dockerfile of the base repo)
  SDL_SHA256: 476e84d6fcbc499cd1f4a2d3fd05a924abc165b5d0e0d53522c9604fe5a021aa
  NDK_VERSION: 21.4.7075529
  ABI: armeabi-v7a

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout this private repo (workflow + your ROM)
        uses: actions/checkout@v4

      - name: Check ROM is present and is the US .z64
        run: |
          if [ ! -f baserom.us.z64 ]; then
            echo "::error::baserom.us.z64 not found in the repo root. Upload your own legally obtained US ROM with exactly that name."
            exit 1
          fi
          echo "$ROM_SHA1  baserom.us.z64" | sha1sum -c - || {
            echo "::error::ROM SHA-1 mismatch. Need the US (NTSC-U) ROM in big-endian .z64 format. Got: $(sha1sum baserom.us.z64)"
            exit 1
          }

      - name: Fetch pinned upstream sources
        run: |
          git clone "$BASE_REPO" android-base
          git -C android-base checkout "$BASE_SHA"
          rm -rf android-base/app/jni/src
          git clone "$GAME_REPO" android-base/app/jni/src
          git -C android-base/app/jni/src checkout "$GAME_SHA"
          git -C android-base rev-parse HEAD
          git -C android-base/app/jni/src rev-parse HEAD

      - name: Patch game to boot straight into Bob-omb Battlefield
        working-directory: android-base/app/jni/src
        run: |
          python3 - <<'PY'
          # Minimal source edits so the game boots directly into Bob-omb Battlefield.
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, "anchor not found exactly once in " + path
              open(path, "w").write(s.replace(old, new))

          # 1) levels/scripts.c: replace the "menu -> level" loop with a direct BoB start
          old = "\n".join([
              "    CALL(/*arg*/ 0, /*func*/ lvl_init_from_save_file),",
              "    LOOP_BEGIN(),",
              "        EXECUTE(/*seg*/ 0x14, _menuSegmentRomStart, _menuSegmentRomEnd, level_main_menu_entry_2),",
              "        JUMP_LINK(script_exec_level_table),",
              "        SLEEP(/*frames*/ 1),",
              "    LOOP_UNTIL(/*op*/ OP_LT, /*arg*/ 0),",
              ""])
          new = "\n".join([
              "    SET_REG(/*value*/ LEVEL_BOB),",
              "    CALL(/*arg*/ 0, /*func*/ lvl_init_from_save_file),",
              "    CALL(/*arg*/ 0, /*func*/ lvl_set_current_level),",
              "    SET_REG(/*value*/ 1),",
              "    GET_OR_SET(/*op*/ OP_SET, /*var*/ VAR_CURR_ACT_NUM),",
              "    LOOP_BEGIN(),",
              "        JUMP_LINK(script_exec_level_table),",
              "        SLEEP(/*frames*/ 1),",
              "    LOOP_UNTIL(/*op*/ OP_LT, /*arg*/ 0),",
              ""])
          patch("levels/scripts.c", old, new)

          # 2) src/game/level_update.c: no castle-grounds intro cutscene on a fresh save
          old = "                    if (save_file_exists(gCurrSaveFileNum - 1)) {\n                        set_mario_action(gMarioState, ACT_IDLE, 0);"
          new = "                    if (TRUE) {\n                        set_mario_action(gMarioState, ACT_IDLE, 0);"
          patch("src/game/level_update.c", old, new)
          print("BoB boot patch applied")
          PY

      - name: Patch FPS limiter + vsync + black translucent touch buttons
        working-directory: android-base/app/jni/src
        run: |
          python3 -m pip install -q pillow || python3 -m pip install -q --break-system-packages pillow || true
          python3 - <<'PY'
          import glob, os, re

          report = []
          def log(m):
              print(m, flush=True)
              report.append(m)

          # =====================================================
          # 1) Speed fix: hard-lock the game to 30 FPS.
          #    Without a limiter the game logic runs once per
          #    displayed frame, so a 60/90/120 Hz phone plays it
          #    2x/3x/4x too fast.
          # =====================================================
          LIMITER = """/* ---- injected: hard 30 FPS limiter + stats for the in-game menu ---- */
          #ifdef __ANDROID__
          #include <stdio.h>
          static void injected_write_stats(float fps, float ms) {
              const char *dir = SDL_AndroidGetInternalStoragePath();
              char path[512];
              int w = 0, h = 0;
              FILE *f;
              SDL_Window *win = SDL_GL_GetCurrentWindow();
              if (!dir) return;
              if (win) SDL_GL_GetDrawableSize(win, &w, &h);
              snprintf(path, sizeof(path), "%s/sm64_stats.txt", dir);
              f = fopen(path, "w");
              if (f) { fprintf(f, "fps=%.1f ms=%.1f w=%d h=%d\\n", fps, ms, w, h); fclose(f); }
          }
          #endif
          static void injected_limit_30fps(void) {
              static Uint64 deadline = 0;
              const Uint64 freq = SDL_GetPerformanceFrequency();
              const Uint64 step = freq / 30;
              Uint64 now = SDL_GetPerformanceCounter();
              if (deadline == 0 || now > deadline + step) {
                  deadline = now; /* first frame or a stall: resync, never fast-forward */
              }
              if (now < deadline) {
                  Uint64 ms = ((deadline - now) * 1000) / freq;
                  if (ms > 2) SDL_Delay((Uint32)(ms - 2));
                  while (SDL_GetPerformanceCounter() < deadline) { }
              }
              deadline += step;
          #ifdef __ANDROID__
              {
                  static Uint64 stat_start = 0;
                  static int stat_frames = 0;
                  Uint64 t = SDL_GetPerformanceCounter();
                  if (stat_start == 0) stat_start = t;
                  stat_frames++;
                  if (t - stat_start >= freq) {
                      double secs = (double)(t - stat_start) / (double)freq;
                      injected_write_stats((float)(stat_frames / secs), (float)(secs * 1000.0 / stat_frames));
                      stat_start = t;
                      stat_frames = 0;
                  }
              }
          #endif
          }
          """

          try:
              pat = re.compile(r'static\s+void\s+gfx_sdl_swap_buffers_begin\s*\(\s*(?:void)?\s*\)\s*\{')
              done = 0
              for p in sorted(glob.glob('src/pc/**/*.c', recursive=True)):
                  s = open(p, encoding='utf-8', errors='replace').read()
                  if 'injected_limit_30fps' in s:
                      continue
                  m = pat.search(s)
                  if not m:
                      continue
                  s = (s[:m.start()] + LIMITER + "\n" + s[m.start():m.end()]
                       + "\n    injected_limit_30fps();\n" + s[m.end():])
                  open(p, 'w', encoding='utf-8').write(s)
                  log("FPS: limiter injected into " + p)
                  done += 1
              if not done:
                  log("FPS WARNING: gfx_sdl_swap_buffers_begin not found - limiter NOT applied")
          except Exception as e:
              log("FPS ERROR: %r" % (e,))

          # ---- vsync off: our own limiter paces the game; with vsync on, a slow
          #      device is rounded down (e.g. 40 ms -> 50 ms = 20 FPS instead of 25) ----
          try:
              rx = re.compile(r'SDL_GL_SetSwapInterval\s*\([^;]*\)')
              for p in sorted(glob.glob('src/pc/**/*.c', recursive=True)):
                  s = open(p, encoding='utf-8', errors='replace').read()
                  s2 = rx.sub('SDL_GL_SetSwapInterval(0)', s)
                  if s2 != s:
                      open(p, 'w', encoding='utf-8').write(s2)
                      log("FPS: vsync disabled in " + p)
          except Exception as e:
              log("FPS vsync step skipped: %r" % (e,))

          # =====================================================
          # 2) Touch buttons: black + translucent
          #    a) recolor the button textures to (almost) black
          #       (alpha shape is kept)
          #    b) force a low alpha on the colors the touch
          #       controller code sets
          # =====================================================
          TOUCH_ALPHA = 110      # 0 = invisible ... 255 = solid
          DARKEN = 0.12          # 0 = pure black, 1 = unchanged

          try:
              from PIL import Image
              files = sorted(glob.glob('textures/touchcontrols/*.png'))
              if not files:
                  log("TOUCH WARNING: no textures/touchcontrols/*.png found")
              for p in files:
                  name = os.path.basename(p).lower()
                  if not re.search(r'button|joy|stick|dpad|circle|pad', name):
                      log("TOUCH: texture left untouched: " + p)
                      continue
                  im = Image.open(p).convert('RGBA')
                  r, g, b, a = im.split()
                  f = lambda v: int(v * DARKEN)
                  Image.merge('RGBA', (r.point(f), g.point(f), b.point(f), a)).save(p)
                  log("TOUCH: texture darkened: " + p)
          except Exception as e:
              log("TOUCH texture step skipped: %r" % (e,))

          def split_args(s):
              out, depth, cur = [], 0, ''
              for ch in s:
                  if ch == ',' and depth == 0:
                      out.append(cur); cur = ''
                  else:
                      if ch in '([': depth += 1
                      elif ch in ')]': depth -= 1
                      cur += ch
              out.append(cur)
              return out

          def patch_alpha(src):
              rx = re.compile(r'\bgDPSet(Env|Prim)Color\s*\(')
              out, i, n = [], 0, 0
              while True:
                  m = rx.search(src, i)
                  if not m:
                      out.append(src[i:])
                      break
                  j, depth = m.end(), 1
                  while j < len(src) and depth:
                      if src[j] == '(': depth += 1
                      elif src[j] == ')': depth -= 1
                      j += 1
                  args = split_args(src[m.end():j - 1])
                  need = 5 if m.group(1) == 'Env' else 7
                  if len(args) == need and args[-1].strip() != '0':
                      args[-1] = ' %d' % TOUCH_ALPHA
                      out.append(src[i:m.end()] + ','.join(args) + ')')
                      n += 1
                  else:
                      out.append(src[i:j])
                  i = j
              return ''.join(out), n

          try:
              touch_c = [p for p in sorted(glob.glob('src/pc/**/*.c', recursive=True))
                         if 'touch' in os.path.basename(p).lower()]
              if not touch_c:
                  log("TOUCH WARNING: no *touch*.c file under src/pc")
              for p in touch_c:
                  s = open(p, encoding='utf-8', errors='replace').read()
                  s2, n = patch_alpha(s)
                  if n:
                      open(p, 'w', encoding='utf-8').write(s2)
                  log("TOUCH: %s -> %d color call(s) set to alpha %d" % (p, n, TOUCH_ALPHA))
          except Exception as e:
              log("TOUCH alpha step skipped: %r" % (e,))

          open('../../../../patch-report.txt', 'w').write("\n".join(report) + "\n")
          PY

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config binutils bsdmainutils \
            libsdl2-dev libgl1-mesa-dev libglew-dev libx11-dev libxrandr-dev \
            libusb-1.0-0-dev libasound2-dev libpulse-dev libaudiofile-dev libzstd-dev \
            wget unzip

      - name: Put ROM where the build expects it
        run: cp baserom.us.z64 android-base/app/jni/src/baserom.us.z64

      - name: Fetch SDL2 2.0.12 sources (same steps as getSDL.sh, plus hash check)
        working-directory: android-base/app/jni/SDL
        run: |
          wget -q https://www.libsdl.org/release/SDL2-2.0.12.zip
          echo "$SDL_SHA256  SDL2-2.0.12.zip" | sha256sum -c -
          unzip -q SDL2-2.0.12.zip
          mv SDL2-2.0.12/src src
          mv SDL2-2.0.12/include include
          ln -s . include/SDL2
          rm -rf SDL2-2.0.12.zip SDL2-2.0.12

      - name: Native make (extracts assets from your ROM, generates sources)
        working-directory: android-base/app/jni/src
        run: |
          set +e
          make -j"$(nproc)" 2>&1 | tee ../../../../native-make.log
          status=${PIPESTATUS[0]}
          set -e
          echo "native make exit status: $status"
          # The Android build only needs the generated files. Verify them
          # explicitly instead of trusting the host link step.
          missing=0
          for f in build/us_pc/assets/mario_anim_data.c \
                   build/us_pc/assets/demo_data.c \
                   build/us_pc/include/level_headers.h \
                   build/us_pc/sound/sound_data.ctl.le.32.inc.c \
                   build/us_pc/sound/sound_data.tbl.le.32.inc.c \
                   build/us_pc/sound/sequences.bin.le.32.inc.c \
                   build/us_pc/sound/bank_sets.le.32.inc.c \
                   levels/bob/0.rgba16.png; do
            if [ ! -f "$f" ]; then echo "::error::missing generated file: $f"; missing=1; fi
          done
          # Texture data is generated INTO the build dir (Makefile rule
          # $(BUILD_DIR)/%.inc.c), not into levels/. Android.mk puts
          # build/us_pc on the include path, so every texture include used by
          # Bob-omb Battlefield must resolve there.
          for inc in $(grep -o '#include "[^"]*\.inc\.c"' levels/bob/texture.inc.c | sed 's/#include "//; s/"$//'); do
            if [ ! -f "build/us_pc/$inc" ]; then echo "::error::missing generated texture: build/us_pc/$inc"; missing=1; fi
          done
          ls build/us_pc/bin/*_skybox.c >/dev/null 2>&1 || { echo "::error::no generated skybox sources"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::host make exited with $status but all generated files exist; continuing to the Android build."
          fi

      - name: Set up JDK 11 (for Gradle 7.1 / AGP 4.2.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # newer cmdline-tools need JDK 17 to run sdkmanager itself
          SDK_JAVA="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | JAVA_HOME="$SDK_JAVA" "$SDKM" --licenses > /dev/null || true
          JAVA_HOME="$SDK_JAVA" "$SDKM" --install "platforms;android-26" "build-tools;30.0.2" "ndk;$NDK_VERSION"

      - name: Restrict native build to one ABI (32-bit ARM, armeabi-v7a)
        working-directory: android-base
        run: |
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters '$ABI'/" app/build.gradle
          sed -i "s/^APP_ABI := .*/APP_ABI := $ABI/" app/jni/Application.mk
          grep -n "abiFilters" app/build.gradle
          grep -n "^APP_ABI" app/jni/Application.mk
          grep -q "^ *abiFilters '$ABI'\$" app/build.gradle || { echo "::error::abiFilters was not rewritten to $ABI"; exit 1; }
          grep -q "^APP_ABI := $ABI\$" app/jni/Application.mk || { echo "::error::APP_ABI was not rewritten to $ABI"; exit 1; }

      - name: Optimize native build (release flags instead of debug)
        working-directory: android-base
        run: |
          python3 - <<'PY'
          import re
          report = open('../patch-report.txt', 'a')
          def log(m):
              print(m, flush=True)
              report.write(m + "\n")

          # 1) Application.mk: force optimized native code (debug builds are -O0 = very slow)
          p = 'app/jni/Application.mk'
          s = open(p).read()
          s = re.sub(r'(?m)^\s*APP_OPTIM\s*[:+?]?=.*\n?', '', s)
          s = s.rstrip('\n') + '\nAPP_OPTIM := release\n'
          open(p, 'w').write(s)
          log("OPT: APP_OPTIM := release in " + p)

          # 2) Gradle: do not ask ndk-build for a debuggable (NDK_DEBUG=1) build
          p = 'app/build.gradle'
          g = open(p).read()
          if 'jniDebuggable' in g:
              log("OPT: build.gradle already has jniDebuggable - left alone")
          else:
              ins = "\n        debug {\n            jniDebuggable false\n        }\n"
              m = re.search(r'buildTypes\s*\{', g)
              if m:
                  g = g[:m.end()] + ins + g[m.end():]
              else:
                  m = re.search(r'\bandroid\s*\{', g)
                  if m:
                      g = g[:m.end()] + "\n    buildTypes {" + ins + "    }\n" + g[m.end():]
              if 'jniDebuggable' in g:
                  open(p, 'w').write(g)
                  log("OPT: jniDebuggable false added to " + p)
              else:
                  log("OPT WARNING: could not edit build.gradle")

          # 3) game Android.mk: -O3 and ARM (not Thumb) code
          p = 'app/jni/src/Android.mk'
          s = open(p).read()
          s = re.sub(r'-O0\b', '-O3', s)
          line = "LOCAL_ARM_MODE := arm\nLOCAL_CFLAGS += -O3\n"
          rx = re.compile(r'(?m)^\s*include\s+\$\(BUILD_SHARED_LIBRARY\)')
          if 'LOCAL_ARM_MODE := arm' not in s and rx.search(s):
              m = rx.search(s)
              s = s[:m.start()] + line + s[m.start():]
              log("OPT: -O3 + ARM mode added to " + p)
          else:
              log("OPT WARNING: BUILD_SHARED_LIBRARY line not found in " + p)
          open(p, 'w').write(s)
          PY
          echo "---- flags currently in the makefiles ----"
          grep -n -E "APP_OPTIM|APP_CFLAGS|LOCAL_CFLAGS|LOCAL_ARM|-O[0-3s]|jniDebuggable" app/jni/Application.mk app/jni/src/Android.mk app/build.gradle || true

      - name: Add in-game stats overlay + menu (FPS, resolution, render scale)
        run: |
          python3 - <<'PY'
          import glob, os, re, shutil

          report = open('patch-report.txt', 'a')
          def log(m):
              print(m, flush=True)
              report.write(m + "\n")

          BASE = 'android-base'
          acts = sorted(glob.glob(BASE + '/app/src/**/SDLActivity.java', recursive=True))
          if not acts:
              log("OVERLAY: SDLActivity.java not found - menu skipped")
              raise SystemExit(0)
          act_path = acts[0]
          pkgdir = os.path.dirname(act_path)
          act_src = open(act_path, encoding='utf-8').read()
          pkg = re.search(r'(?m)^\s*package\s+([\w.]+)\s*;', act_src).group(1)

          if not re.search(r'setContentView\(\s*mLayout\s*\)\s*;', act_src):
              log("OVERLAY: 'setContentView(mLayout);' not found - menu skipped")
              raise SystemExit(0)

          os.makedirs('overlay-backup', exist_ok=True)
          def backup(path):
              rel = os.path.relpath(path, BASE)
              dst = os.path.join('overlay-backup', rel)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              if not os.path.exists(dst):
                  shutil.copy(path, dst)

          # --- touch fix: with a smaller render buffer SDL must still normalise
          #     finger positions by the REAL view size, otherwise touch breaks ---
          nx = ny = 0
          for jp in sorted(glob.glob(pkgdir + '/*.java')):
              s = open(jp, encoding='utf-8').read()
              s2, a = re.subn(r'(\.getX\(\s*\w*\s*\))\s*/\s*mWidth\b', r'\1 / (float) getWidth()', s)
              s2, b = re.subn(r'(\.getY\(\s*\w*\s*\))\s*/\s*mHeight\b', r'\1 / (float) getHeight()', s2)
              if a or b:
                  backup(jp)
                  open(jp, 'w', encoding='utf-8').write(s2)
                  log("OVERLAY: touch normalisation patched in %s (x:%d y:%d)" % (jp, a, b))
              nx += a; ny += b
          scale_ok = (nx > 0 and ny > 0)
          if not scale_ok:
              log("OVERLAY: touch normalisation not found - render-scale option disabled")

          # --- hook into SDLActivity.onCreate ---
          backup(act_path)
          act_src = open(act_path, encoding='utf-8').read()
          act_src = re.sub(r'(setContentView\(\s*mLayout\s*\)\s*;)',
                           r'\1\n        SM64Overlay.attach(this, mSurface, mLayout);',
                           act_src, count=1)
          open(act_path, 'w', encoding='utf-8').write(act_src)

          JAVA = r"""package @@PKG@@;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.DialogInterface;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.SurfaceView;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileReader;

          /** Small on-screen FPS / resolution bar + menu. Injected at build time. */
          public class SM64Overlay {
              static final boolean SCALE_OK = @@SCALE@@;
              private static final int[] SCALES = {100, 75, 60, 50, 40};
              private static final String TAG = "SM64Overlay";

              private static TextView bar;
              private static boolean showStats = true;
              private static int scaleIdx = 2;
              private static String fps = "--";
              private static String ms = "--";
              private static int renderW = 0;
              private static int renderH = 0;
              private static int viewW = 0;
              private static int viewH = 0;

              public static void attach(final Activity act, final View surface, final ViewGroup layout) {
                  try {
                      doAttach(act, surface, layout);
                  } catch (Throwable t) {
                      Log.e(TAG, "overlay disabled", t);
                  }
              }

              private static void doAttach(final Activity act, final View surface, final ViewGroup layout) {
                  final SharedPreferences prefs = act.getSharedPreferences("sm64_overlay", 0);
                  showStats = prefs.getBoolean("stats", true);
                  scaleIdx = prefs.getInt("scale", 2);
                  if (scaleIdx < 0 || scaleIdx >= SCALES.length) {
                      scaleIdx = 2;
                  }

                  FrameLayout root = new FrameLayout(act);
                  bar = new TextView(act);
                  bar.setTextColor(Color.WHITE);
                  bar.setTextSize(11);
                  bar.setPadding(14, 6, 14, 6);
                  bar.setBackgroundColor(Color.argb(110, 0, 0, 0));
                  bar.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          showMenu(act, surface, prefs);
                      }
                  });
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  root.addView(bar, lp);
                  updateBar();
                  layout.addView(root, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));

                  if (SCALE_OK) {
                      surface.addOnLayoutChangeListener(new View.OnLayoutChangeListener() {
                          public void onLayoutChange(View v, int left, int top, int right, int bottom,
                                                     int oldLeft, int oldTop, int oldRight, int oldBottom) {
                              int w = right - left;
                              int h = bottom - top;
                              if (w != viewW || h != viewH) {
                                  viewW = w;
                                  viewH = h;
                                  applyScale(v);
                              }
                          }
                      });
                  }

                  final Handler handler = new Handler(Looper.getMainLooper());
                  final File statsFile = new File(act.getFilesDir(), "sm64_stats.txt");
                  handler.post(new Runnable() {
                      public void run() {
                          readStats(statsFile);
                          updateBar();
                          handler.postDelayed(this, 500);
                      }
                  });
              }

              private static void applyScale(View surface) {
                  if (!SCALE_OK || !(surface instanceof SurfaceView)) {
                      return;
                  }
                  int w = surface.getWidth();
                  int h = surface.getHeight();
                  if (w <= 0 || h <= 0) {
                      return;
                  }
                  int pct = SCALES[scaleIdx];
                  SurfaceView sv = (SurfaceView) surface;
                  if (pct >= 100) {
                      sv.getHolder().setSizeFromLayout();
                  } else {
                      sv.getHolder().setFixedSize(Math.max(320, w * pct / 100), Math.max(180, h * pct / 100));
                  }
              }

              private static void readStats(File f) {
                  BufferedReader br = null;
                  try {
                      br = new BufferedReader(new FileReader(f));
                      String line = br.readLine();
                      if (line == null) {
                          return;
                      }
                      String[] parts = line.trim().split(" ");
                      for (int i = 0; i < parts.length; i++) {
                          String[] kv = parts[i].split("=");
                          if (kv.length != 2) {
                              continue;
                          }
                          if (kv[0].equals("fps")) {
                              fps = kv[1];
                          } else if (kv[0].equals("ms")) {
                              ms = kv[1];
                          } else if (kv[0].equals("w")) {
                              renderW = Integer.parseInt(kv[1]);
                          } else if (kv[0].equals("h")) {
                              renderH = Integer.parseInt(kv[1]);
                          }
                      }
                  } catch (Throwable t) {
                      // not written yet or being rewritten: keep the old values
                  } finally {
                      try {
                          if (br != null) {
                              br.close();
                          }
                      } catch (Throwable t2) {
                          // ignore
                      }
                  }
              }

              private static void updateBar() {
                  if (bar == null) {
                      return;
                  }
                  if (showStats) {
                      bar.setText("FPS " + fps + "  |  " + renderW + "x" + renderH + "  |  MENU");
                  } else {
                      bar.setText("MENU");
                  }
              }

              private static void showMenu(final Activity act, final View surface, final SharedPreferences prefs) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("FPS: ").append(fps).append("  (").append(ms).append(" ms/frame)\n");
                  sb.append("Frame limit: 30 FPS (original game speed)\n");
                  sb.append("Render resolution: ").append(renderW).append("x").append(renderH).append("\n");
                  sb.append("Screen: ").append(surface.getWidth()).append("x").append(surface.getHeight()).append("\n");
                  sb.append("Display refresh: ").append(act.getWindowManager().getDefaultDisplay().getRefreshRate()).append(" Hz\n");
                  if (SCALE_OK) {
                      sb.append("Render scale: ").append(SCALES[scaleIdx]).append("%\n");
                  }
                  sb.append("Device: ").append(Build.MANUFACTURER).append(" ").append(Build.MODEL).append("\n");
                  sb.append("Android ").append(Build.VERSION.RELEASE).append(" (API ").append(Build.VERSION.SDK_INT).append(")\n");
                  sb.append("CPU ABI: ").append(Build.CPU_ABI);

                  AlertDialog.Builder b = new AlertDialog.Builder(act);
                  b.setTitle("SM64 Info");
                  b.setMessage(sb.toString());
                  b.setPositiveButton(showStats ? "Hide stats" : "Show stats", new DialogInterface.OnClickListener() {
                      public void onClick(DialogInterface d, int which) {
                          showStats = !showStats;
                          prefs.edit().putBoolean("stats", showStats).apply();
                          updateBar();
                      }
                  });
                  if (SCALE_OK) {
                      b.setNegativeButton("Scale " + SCALES[scaleIdx] + "% (change)", new DialogInterface.OnClickListener() {
                          public void onClick(DialogInterface d, int which) {
                              scaleIdx = (scaleIdx + 1) % SCALES.length;
                              prefs.edit().putInt("scale", scaleIdx).apply();
                              applyScale(surface);
                          }
                      });
                  }
                  b.setNeutralButton("Close", null);
                  b.show();
              }
          }
          """
          # remove the YAML-induced indentation is already done by YAML; fill the tokens
          JAVA = JAVA.replace('@@PKG@@', pkg).replace('@@SCALE@@', 'true' if scale_ok else 'false')
          out = os.path.join(pkgdir, 'SM64Overlay.java')
          open(out, 'w', encoding='utf-8').write(JAVA)
          open('overlay-created.txt', 'w').write(out + "\n")
          log("OVERLAY: SM64Overlay.java created in " + pkgdir + " (scale option: %s)" % scale_ok)
          PY

      - name: Build debug APK
        working-directory: android-base
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon --stacktrace; then
            echo "::warning::Build failed. Retrying WITHOUT the Java overlay/menu patch."
            if [ -d ../overlay-backup ]; then
              cp -r ../overlay-backup/. .
              if [ -f ../overlay-created.txt ]; then rm -f $(sed 's#^android-base/##' ../overlay-created.txt); fi
              echo "OVERLAY: DISABLED (Java compile failed, retried without it)" >> ../patch-report.txt
              ./gradlew assembleDebug --no-daemon --stacktrace
            else
              exit 1
            fi
          fi

      - name: Verify APK exists and every native library is 32-bit ARM
        run: |
          APK=android-base/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          ls -l "$APK"
          test "$(stat -c %s "$APK")" -gt 1000000 || { echo "::error::APK suspiciously small"; exit 1; }
          unzip -l "$APK" | grep -E "lib/$ABI/(libmain|libSDL2)\\.so"
          libs=$(unzip -Z1 "$APK" | grep -E '^lib/.*\.so$' || true)
          test -n "$libs" || { echo "::error::no native libraries in APK"; exit 1; }
          if echo "$libs" | grep -qv "^lib/$ABI/"; then
            echo "::error::APK contains native libraries for other ABIs:"; echo "$libs"; exit 1
          fi
          rm -rf apk-libs && mkdir apk-libs
          unzip -q -o "$APK" 'lib/*' -d apk-libs
          fail=0
          for so in $(find apk-libs -name '*.so' | sort); do
            hdr=$(readelf -h "$so")
            cls=$(echo "$hdr" | sed -n 's/^ *Class: *//p')
            mach=$(echo "$hdr" | sed -n 's/^ *Machine: *//p')
            echo "$so -> class=[$cls] machine=[$mach]"
            readelf -A "$so" | grep -E "Tag_CPU_arch:" || true
            if [ "$cls" != "ELF32" ] || [ "$mach" != "ARM" ]; then
              echo "::error::$so is not 32-bit ARM"; fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          mkdir -p dist
          cp "$APK" dist/sm64-bob-debug-armv7.apk
          sha256sum dist/sm64-bob-debug-armv7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64-bob-debug-armv7-apk
          path: dist/sm64-bob-debug-armv7.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: native-make.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect source files for diagnosis
        if: always()
        run: |
          mkdir -p diag
          S=android-base/app/jni/src
          find "$S/src/pc" -maxdepth 2 -type f \( -iname '*touch*' -o -name 'gfx_sdl*.c' -o -name 'pc_main.c' \) -exec cp {} diag/ \; 2>/dev/null || true
          find android-base/app/src -name 'SDLActivity.java' -o -name 'SM64Overlay.java' | while read f; do cp "$f" diag/; done
          cp android-base/app/build.gradle diag/build.gradle.txt 2>/dev/null || true
          cp android-base/app/jni/Application.mk diag/Application.mk.txt 2>/dev/null || true
          cp "$S/Android.mk" diag/src-Android.mk.txt 2>/dev/null || true
          ls "$S/textures/touchcontrols" > diag/touch-textures.txt 2>&1 || true
          cp patch-report.txt diag/ 2>/dev/null || true

      - name: Upload diagnosis files (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-diag
          path: diag
          if-no-files-found: ignore
          retention-days: 7
