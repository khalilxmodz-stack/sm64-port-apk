name: Build SM64 Bob-omb Battlefield APK

# Build recipe follows the README of VDavid003/sm64-port-android-base:
#   1) baserom.us.z64 into app/jni/src   2) fetch SDL2 sources
#   3) native `make` in app/jni/src (extracts assets, generates C sources)
#   4) ./gradlew assembleDebug (ndk-build through app/jni/Android.mk)
# Written without being able to run it. If a step fails, read that step's log.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # Upstream sources, pinned to the exact commits that were inspected.
  BASE_REPO: https://github.com/VDavid003/sm64-port-android-base.git
  BASE_SHA: a71e0c11b7645ec401fcfc376295134f4e5e81b7
  GAME_REPO: https://github.com/VDavid003/sm64-port-android.git
  GAME_SHA: b43af4667bd1cde0d6cb11004add92ffaffab1c5
  # US ROM, big-endian .z64 (from sm64.us.sha1 in the source)
  ROM_SHA1: 9bef1128717f958171a4afac3ed78ee2bb4e86ce
  # SDL2 2.0.12 zip hash (from the Dockerfile of the base repo)
  SDL_SHA256: 476e84d6fcbc499cd1f4a2d3fd05a924abc165b5d0e0d53522c9604fe5a021aa
  NDK_VERSION: 21.4.7075529
  ABI: armeabi-v7a

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout this private repo (workflow + your ROM)
        uses: actions/checkout@v4

      - name: Check ROM is present and is the US .z64
        run: |
          if [ ! -f baserom.us.z64 ]; then
            echo "::error::baserom.us.z64 not found in the repo root. Upload your own legally obtained US ROM with exactly that name."
            exit 1
          fi
          echo "$ROM_SHA1  baserom.us.z64" | sha1sum -c - || {
            echo "::error::ROM SHA-1 mismatch. Need the US (NTSC-U) ROM in big-endian .z64 format. Got: $(sha1sum baserom.us.z64)"
            exit 1
          }

      - name: Fetch pinned upstream sources
        run: |
          git clone "$BASE_REPO" android-base
          git -C android-base checkout "$BASE_SHA"
          rm -rf android-base/app/jni/src
          git clone "$GAME_REPO" android-base/app/jni/src
          git -C android-base/app/jni/src checkout "$GAME_SHA"
          git -C android-base rev-parse HEAD
          git -C android-base/app/jni/src rev-parse HEAD

      - name: Patch game to boot straight into Bob-omb Battlefield
        working-directory: android-base/app/jni/src
        run: |
          python3 - <<'PY'
          # Minimal source edits so the game boots directly into Bob-omb Battlefield.
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, "anchor not found exactly once in " + path
              open(path, "w").write(s.replace(old, new))

          # 1) levels/scripts.c: replace the "menu -> level" loop with a direct BoB start
          old = "\n".join([
              "    CALL(/*arg*/ 0, /*func*/ lvl_init_from_save_file),",
              "    LOOP_BEGIN(),",
              "        EXECUTE(/*seg*/ 0x14, _menuSegmentRomStart, _menuSegmentRomEnd, level_main_menu_entry_2),",
              "        JUMP_LINK(script_exec_level_table),",
              "        SLEEP(/*frames*/ 1),",
              "    LOOP_UNTIL(/*op*/ OP_LT, /*arg*/ 0),",
              ""])
          new = "\n".join([
              "    SET_REG(/*value*/ LEVEL_BOB),",
              "    CALL(/*arg*/ 0, /*func*/ lvl_init_from_save_file),",
              "    CALL(/*arg*/ 0, /*func*/ lvl_set_current_level),",
              "    SET_REG(/*value*/ 1),",
              "    GET_OR_SET(/*op*/ OP_SET, /*var*/ VAR_CURR_ACT_NUM),",
              "    LOOP_BEGIN(),",
              "        JUMP_LINK(script_exec_level_table),",
              "        SLEEP(/*frames*/ 1),",
              "    LOOP_UNTIL(/*op*/ OP_LT, /*arg*/ 0),",
              ""])
          patch("levels/scripts.c", old, new)

          # 2) src/game/level_update.c: no castle-grounds intro cutscene on a fresh save
          old = "                    if (save_file_exists(gCurrSaveFileNum - 1)) {\n                        set_mario_action(gMarioState, ACT_IDLE, 0);"
          new = "                    if (TRUE) {\n                        set_mario_action(gMarioState, ACT_IDLE, 0);"
          patch("src/game/level_update.c", old, new)
          print("BoB boot patch applied")
          PY

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config binutils bsdmainutils \
            libsdl2-dev libgl1-mesa-dev libglew-dev libx11-dev libxrandr-dev \
            libusb-1.0-0-dev libasound2-dev libpulse-dev libaudiofile-dev libzstd-dev \
            wget unzip

      - name: Put ROM where the build expects it
        run: cp baserom.us.z64 android-base/app/jni/src/baserom.us.z64

      - name: Fetch SDL2 2.0.12 sources (same steps as getSDL.sh, plus hash check)
        working-directory: android-base/app/jni/SDL
        run: |
          wget -q https://www.libsdl.org/release/SDL2-2.0.12.zip
          echo "$SDL_SHA256  SDL2-2.0.12.zip" | sha256sum -c -
          unzip -q SDL2-2.0.12.zip
          mv SDL2-2.0.12/src src
          mv SDL2-2.0.12/include include
          ln -s . include/SDL2
          rm -rf SDL2-2.0.12.zip SDL2-2.0.12

      - name: Native make (extracts assets from your ROM, generates sources)
        working-directory: android-base/app/jni/src
        run: |
          set +e
          make -j"$(nproc)" 2>&1 | tee ../../../../native-make.log
          status=${PIPESTATUS[0]}
          set -e
          echo "native make exit status: $status"
          # The Android build only needs the generated files. Verify them
          # explicitly instead of trusting the host link step.
          missing=0
          for f in build/us_pc/assets/mario_anim_data.c \
                   build/us_pc/assets/demo_data.c \
                   build/us_pc/include/level_headers.h \
                   build/us_pc/sound/sound_data.ctl.le.32.inc.c \
                   build/us_pc/sound/sound_data.tbl.le.32.inc.c \
                   build/us_pc/sound/sequences.bin.le.32.inc.c \
                   build/us_pc/sound/bank_sets.le.32.inc.c \
                   levels/bob/0.rgba16.png; do
            if [ ! -f "$f" ]; then echo "::error::missing generated file: $f"; missing=1; fi
          done
          # Texture data is generated INTO the build dir (Makefile rule
          # $(BUILD_DIR)/%.inc.c), not into levels/. Android.mk puts
          # build/us_pc on the include path, so every texture include used by
          # Bob-omb Battlefield must resolve there.
          for inc in $(grep -o '#include "[^"]*\.inc\.c"' levels/bob/texture.inc.c | sed 's/#include "//; s/"$//'); do
            if [ ! -f "build/us_pc/$inc" ]; then echo "::error::missing generated texture: build/us_pc/$inc"; missing=1; fi
          done
          ls build/us_pc/bin/*_skybox.c >/dev/null 2>&1 || { echo "::error::no generated skybox sources"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::host make exited with $status but all generated files exist; continuing to the Android build."
          fi

      - name: Set up JDK 11 (for Gradle 7.1 / AGP 4.2.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # newer cmdline-tools need JDK 17 to run sdkmanager itself
          SDK_JAVA="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | JAVA_HOME="$SDK_JAVA" "$SDKM" --licenses > /dev/null || true
          JAVA_HOME="$SDK_JAVA" "$SDKM" --install "platforms;android-26" "build-tools;30.0.2" "ndk;$NDK_VERSION"

      - name: Restrict native build to one ABI (32-bit ARM, armeabi-v7a)
        working-directory: android-base
        run: |
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters '$ABI'/" app/build.gradle
          sed -i "s/^APP_ABI := .*/APP_ABI := $ABI/" app/jni/Application.mk
          grep -n "abiFilters" app/build.gradle
          grep -n "^APP_ABI" app/jni/Application.mk
          grep -q "^ *abiFilters '$ABI'\$" app/build.gradle || { echo "::error::abiFilters was not rewritten to $ABI"; exit 1; }
          grep -q "^APP_ABI := $ABI\$" app/jni/Application.mk || { echo "::error::APP_ABI was not rewritten to $ABI"; exit 1; }

      - name: Build debug APK
        working-directory: android-base
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists and every native library is 32-bit ARM
        run: |
          APK=android-base/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          ls -l "$APK"
          test "$(stat -c %s "$APK")" -gt 1000000 || { echo "::error::APK suspiciously small"; exit 1; }
          unzip -l "$APK" | grep -E "lib/$ABI/(libmain|libSDL2)\\.so"
          libs=$(unzip -Z1 "$APK" | grep -E '^lib/.*\.so$' || true)
          test -n "$libs" || { echo "::error::no native libraries in APK"; exit 1; }
          if echo "$libs" | grep -qv "^lib/$ABI/"; then
            echo "::error::APK contains native libraries for other ABIs:"; echo "$libs"; exit 1
          fi
          rm -rf apk-libs && mkdir apk-libs
          unzip -q -o "$APK" 'lib/*' -d apk-libs
          fail=0
          for so in $(find apk-libs -name '*.so' | sort); do
            hdr=$(readelf -h "$so")
            cls=$(echo "$hdr" | sed -n 's/^ *Class: *//p')
            mach=$(echo "$hdr" | sed -n 's/^ *Machine: *//p')
            echo "$so -> class=[$cls] machine=[$mach]"
            readelf -A "$so" | grep -E "Tag_CPU_arch:" || true
            if [ "$cls" != "ELF32" ] || [ "$mach" != "ARM" ]; then
              echo "::error::$so is not 32-bit ARM"; fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          mkdir -p dist
          cp "$APK" dist/sm64-bob-debug-armv7.apk
          sha256sum dist/sm64-bob-debug-armv7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64-bob-debug-armv7-apk
          path: dist/sm64-bob-debug-armv7.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: native-make.log
          if-no-files-found: ignore
          retention-days: 7
